<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导入规则 - Page Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #202124;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      border-radius: 8px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #5f6368; margin-bottom: 24px; }
    .file-area {
      border: 2px dashed #dadce0;
      border-radius: 8px;
      padding: 32px 16px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 16px;
    }
    .file-area:hover, .file-area.dragover {
      border-color: #4285f4;
      background: rgba(66,133,244,0.04);
    }
    .file-area .icon { font-size: 36px; margin-bottom: 8px; }
    .file-area p { font-size: 13px; color: #5f6368; }
    input[type="file"] { display: none; }
    .btn {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #dadce0;
      background: #fff;
      color: #202124;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn:hover { background: #f1f3f4; }
    .btn-primary {
      background: #4285f4;
      color: #fff;
      border-color: #4285f4;
    }
    .btn-primary:hover { background: #3367d6; }
    #status {
      margin-top: 16px;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 4px;
      display: none;
    }
    #status.success { display: block; background: #e6f4ea; color: #137333; }
    #status.error { display: block; background: #fce8e6; color: #c5221f; }
    #status.info { display: block; background: #e8f0fe; color: #1967d2; }
  </style>
</head>
<body>
  <div class="container">
    <h1>导入规则配置</h1>
    <p class="subtitle">选择之前导出的 JSON 配置文件</p>

    <div class="file-area" id="drop-area">
      <div class="icon">📁</div>
      <p>点击此处选择文件</p>
      <p style="font-size:11px;color:#9aa0a6;margin-top:4px">或拖拽 .json 文件到此处</p>
    </div>

    <input type="file" id="file-input" accept=".json">

    <div id="status"></div>
  </div>

  <script src="import.js"></script>
</body>
</html>
